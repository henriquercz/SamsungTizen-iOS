workflows:
  ios-sideload-build:
    name: Build SamsungTizen iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build and Package IPA for Sideloading
        script: |
          set -e
          xcodebuild archive \
            -project SamsungTizen.xcodeproj \
            -scheme SamsungTizen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SamsungTizen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/SamsungTizen.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr SamsungTizen.ipa Payload
    artifacts:
      - build/SamsungTizen.ipa
