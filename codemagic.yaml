workflows:
  ios-sideload-build:
    name: Build SamsungTizen iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build and Package IPA for Sideloading
        script: |
          set -e
          xcodebuild archive \
            -project SamsungTizen.xcodeproj \
            -scheme SamsungTizen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SamsungTizen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/SamsungTizen.xcarchive/Products/Applications/*.app build/Payload/

          # Guarantee all required keys are in the app bundle Info.plist for native fullscreen on all iPhones
          APP_DIR=$(ls -d build/Payload/*.app | head -n 1)
          python3 -c "
import plistlib
plist_path = '${APP_DIR}/Info.plist'
try:
    with open(plist_path, 'rb') as f:
        p = plistlib.load(f)
except Exception:
    p = {}

with open('Sources/SamsungTizen/Info.plist', 'rb') as f:
    source_p = plistlib.load(f)

p.update(source_p)
p['UILaunchStoryboardName'] = 'LaunchScreen'
p['UILaunchScreen'] = {}
p['CFBundleDisplayName'] = 'Controle Samsung'
p['CFBundleDevelopmentRegion'] = 'pt-BR'

with open(plist_path, 'wb') as f:
    plistlib.dump(p, f)
print('Successfully verified and merged Info.plist in app bundle:')
for k, v in sorted(p.items()):
    print(f'  {k}: {v}')
"

          cd build
          zip -qr SamsungTizen.ipa Payload
    artifacts:
      - build/SamsungTizen.ipa
